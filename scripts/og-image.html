<!doctype html>
<!--
  Template for public/og-image.png (1200×630).
  Open in a browser at 1200×630 and take a screenshot, e.g. with headless Chrome:
  chrome --headless --screenshot=public/og-image.png --window-size=1200,630 scripts/og-image.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OG image</title>
    <style>
      @font-face {
        font-family: 'Inter';
        src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2') format('woff2');
        font-weight: 400;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #143656;
        color: #f8fafc;
        font-family: 'Inter', system-ui, sans-serif;
        position: relative;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.055) 1px, transparent 1px);
        background-size: 40px 40px;
      }
      .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .bar {
        position: absolute; inset: 0 0 auto 0; height: 56px;
        display: flex; align-items: center; gap: 22px; padding: 0 64px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.16);
        font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: #cbd5e1;
        background: rgba(11, 17, 32, 0.25);
      }
      .bar .dot { width: 10px; height: 10px; border-radius: 50%; background: #34d399; display: inline-block; margin-right: 10px; }
      .bar .sep { color: rgba(255, 255, 255, 0.35); }
      .main { position: absolute; left: 64px; top: 112px; width: 690px; }
      .eyebrow { font-size: 16px; letter-spacing: 0.1em; color: #93c5fd; text-transform: uppercase; }
      h1 { margin-top: 18px; font-size: 62px; line-height: 1.04; font-weight: 650; letter-spacing: -0.02em; }
      .sub { margin-top: 22px; font-size: 26px; line-height: 1.35; color: #e2e8f0; font-weight: 450; }
      .chips { margin-top: 34px; display: flex; flex-wrap: wrap; gap: 8px; }
      .chip {
        font-size: 15px; padding: 6px 10px; border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 6px; color: #f1f5f9; background: rgba(255, 255, 255, 0.06);
      }
      .foot {
        position: absolute; left: 64px; right: 64px; bottom: 36px;
        display: flex; justify-content: space-between; font-size: 16px; color: #cbd5e1; letter-spacing: 0.04em;
      }
      .photo { position: absolute; right: 72px; top: 112px; width: 300px; padding: 8px; border: 1px solid rgba(255, 255, 255, 0.35); background: rgba(255, 255, 255, 0.06); }
      .photo img { display: block; width: 100%; height: 360px; object-fit: cover; object-position: top; }
      .mark { position: absolute; width: 16px; height: 16px; border-color: #f8fafc; border-style: solid; }
      .tl { top: -7px; left: -7px; border-width: 3px 0 0 3px; }
      .tr { top: -7px; right: -7px; border-width: 3px 3px 0 0; }
      .bl { bottom: -7px; left: -7px; border-width: 0 0 3px 3px; }
      .br { bottom: -7px; right: -7px; border-width: 0 3px 3px 0; }
      .cap { margin-top: 10px; font-size: 13px; color: #cbd5e1; letter-spacing: 0.08em; text-transform: uppercase; display: flex; justify-content: space-between; }
    </style>
  </head>
  <body>
    <div class="bar mono">
      <span>Dresden, DE</span><span class="sep">/</span>
      <span>DAAD-KOSPIE @ TU Dresden</span><span class="sep">/</span>
      <span><span class="dot"></span>Internship from late March 2027 · 40 h/week</span>
    </div>

    <div class="main">
      <p class="eyebrow mono">00 // Portfolio</p>
      <h1>Alain Josué<br />Tolentino Ibarra</h1>
      <p class="sub">DAAD-KOSPIE Scholar @ TU Dresden<br />Web &amp; Software Engineering</p>
      <div class="chips mono">
        <span class="chip">HTML5</span><span class="chip">CSS3</span><span class="chip">Tailwind</span>
        <span class="chip">JavaScript</span><span class="chip">React</span><span class="chip">Astro</span>
        <span class="chip">Node.js</span><span class="chip">SQL</span>
      </div>
    </div>

    <figure class="photo">
      <span class="mark tl"></span><span class="mark tr"></span><span class="mark bl"></span><span class="mark br"></span>
      <img src="../src/assets/portrait.jpg" alt="" />
      <figcaption class="cap mono"><span>Fig. 01</span><span>B.Sc. · Grade 1.3</span></figcaption>
    </figure>

    <div class="foot mono">
      <span>alain-tolentino-portfolio.vercel.app</span>
      <span>DE B2 · EN C1 · ES</span>
    </div>
  </body>
</html>
