<!doctype html>
<!--
  Template for public/og-image.png (1200×630) – "Swiss-German Editorial Engineering".
  Render at 1200×630 with headless Chrome:
  chrome --headless --screenshot=public/og-image.png --window-size=1200,630 scripts/og-image.html
  Fonts are loaded from node_modules (self-hosted), never from Google Fonts.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OG image</title>
    <style>
      @font-face { font-family: 'Jakarta'; src: url('../node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-800-normal.woff2') format('woff2'); font-weight: 800; }
      @font-face { font-family: 'Inter'; src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
      @font-face { font-family: 'JBM'; src: url('../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2') format('woff2'); font-weight: 500; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #0b1120; color: #f8fafc; font-family: 'Inter', sans-serif; position: relative;
        background-image: linear-gradient(rgba(248,250,252,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(248,250,252,.045) 1px, transparent 1px);
        background-size: 40px 40px;
      }
      .mono { font-family: 'JBM', monospace; }
      .rule { position: absolute; left: 56px; right: 56px; display: flex; align-items: center; gap: 16px; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: #94a3b8; }
      .rule i { flex: 1; height: 1px; background: #334155; }
      .cross { width: 13px; height: 13px; position: relative; flex: none; }
      .cross::before, .cross::after { content: ''; position: absolute; background: #f59e0b; }
      .cross::before { left: 6px; top: 0; width: 1px; height: 13px; }
      .cross::after { top: 6px; left: 0; height: 1px; width: 13px; }
      .top { top: 44px; } .bottom { bottom: 40px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #10b981; display: inline-block; margin-right: 10px; vertical-align: 1px; }
      .main { position: absolute; left: 56px; top: 118px; width: 700px; }
      .eyebrow { font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: #38bdf8; }
      h1 { margin-top: 18px; font-family: 'Jakarta', sans-serif; font-weight: 800; font-size: 70px; line-height: 1.0; letter-spacing: -0.03em; }
      .sub { margin-top: 24px; font-size: 25px; line-height: 1.4; color: #cbd5e1; }
      .sub b { color: #f8fafc; font-weight: 600; }
      .chips { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 8px; }
      .chip { font-size: 15px; padding: 6px 10px; border: 1px solid #334155; border-radius: 6px; color: #cbd5e1; background: #0f172a; }
      .panel { position: absolute; right: 56px; top: 104px; width: 316px; background: #143656; border: 1px solid #1e4a73; padding: 10px; }
      .panel img { display: block; width: 100%; height: 330px; object-fit: cover; object-position: top; }
      .mk { position: absolute; width: 18px; height: 18px; border: solid #f59e0b; }
      .tl { top: -8px; left: -8px; border-width: 3px 0 0 3px; } .tr { top: -8px; right: -8px; border-width: 3px 3px 0 0; }
      .bl { bottom: -8px; left: -8px; border-width: 0 0 3px 3px; } .br { bottom: -8px; right: -8px; border-width: 0 3px 3px 0; }
      .cap { display: flex; justify-content: space-between; padding: 10px 4px 2px; font-size: 13px; color: #e2e8f0; letter-spacing: .08em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div class="rule top mono"><span class="cross"></span><span><span class="dot"></span>Internship · late March 2027 · 40 h/week</span><i></i><span>AT // ajlittlebro</span><span class="cross"></span></div>

    <div class="main">
      <p class="eyebrow mono">Dresden · TU Dresden · DAAD-KOSPIE</p>
      <h1>Alain Josué<br />Tolentino Ibarra</h1>
      <p class="sub"><b>DAAD-KOSPIE Scholar @ TU Dresden</b><br />Web &amp; Software Engineering · B.Sc. grade 1.3</p>
      <div class="chips mono">
        <span class="chip">React</span><span class="chip">Astro</span><span class="chip">JavaScript</span><span class="chip">Tailwind</span>
        <span class="chip">Node.js</span><span class="chip">Express</span><span class="chip">MySQL</span><span class="chip">SVG</span>
      </div>
    </div>

    <figure class="panel">
      <span class="mk tl"></span><span class="mk tr"></span><span class="mk bl"></span><span class="mk br"></span>
      <img src="../src/assets/portrait.jpg" alt="" />
      <figcaption class="cap mono"><span>Fig. 00</span><span>DE B2 · EN C1 · ES</span></figcaption>
    </figure>

    <div class="rule bottom mono"><span>MTY 25.68° N</span><i></i><span style="color:#f59e0b">Code &amp; Curiosity</span><i></i><span>DRS 51.05° N</span></div>
  </body>
</html>
